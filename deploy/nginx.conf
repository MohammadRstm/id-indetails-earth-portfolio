# Serves the website's static build and proxies its public API, so the browser only ever talks to one origin.
# HTTPS is handled in front of this container (Caddy on the server); this listens on plain HTTP, port 8080.
#
# The security headers are repeated in every location that adds a header of its own, because nginx drops the
# server's add_header lines in such a location.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The site, the Google Maps embeds on /contact, and Google Analytics once a visitor accepts it (the hosts Google
    # lists for GA4 without advertising features: tag script, measurement requests). Nothing else is loaded from elsewhere.
    set $csp "default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.googletagmanager.com https://*.google-analytics.com; font-src 'self'; connect-src 'self' https://www.googletagmanager.com https://*.google-analytics.com https://*.google.com; frame-src https://www.google.com https://maps.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # For the container health check and an uptime monitor.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The public website API (anonymous, read-only apart from the contact form), on the API container.
    # Resolved per request through Docker's DNS, so this container starts even before the API exists.
    location /api/public/website/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        client_max_body_size 64k;
    }

    # No other part of the API is reachable through the website.
    location /api/ {
        return 404;
    }

    # Vite's hashed bundles never change under the same name: cache them for a year.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # The page itself is checked on every visit, so a new deployment shows at once.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Files that exist are served (photos, textures, the map data); every other address is a page of the
    # single-page app (/projects, /projects/<slug>, /studio, /contact) and gets index.html.
    location / {
        try_files $uri /index.html;
    }
}
