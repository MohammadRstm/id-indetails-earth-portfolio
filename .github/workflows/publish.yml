# Publishes the website image and, once hosting is set up, deploys it. Started by hand only (Actions → Publish →
# Run workflow).
#
# - Publish: builds the given ref, tags the image with its commit (sha-<7>) and pushes it to GHCR.
# - Deploy (tick "deploy"): also starts that image on the server, after a reviewer approves the production
#   environment. Needs the server side in place first (README, "Deploying"): a `website` service in the server's
#   compose file, a Caddy site for the website's domain, and the production environment's secrets.
# - Rollback: give `tag` of an image published earlier; it is deployed without building.
name: Publish

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build
        default: master
        required: true
      deploy:
        description: Also deploy it to the server
        type: boolean
        default: false
      tag:
        description: "Rollback: deploy this published tag (e.g. sha-1a2b3c4) instead of building"
        required: false

# One run at a time; a second one waits instead of interrupting the first.
concurrency:
  group: website-publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/mohammadrstm
  IMAGE: id-indetails-website

jobs:
  publish:
    name: Publish the image
    if: inputs.tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - id: tag
        run: echo "tag=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The tests run first (the check stage); a failure stops the publish.
      - name: Type-check, lint and run the tests
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: check
          push: false
          cache-from: type=gha,scope=website

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=website

  deploy:
    name: Deploy to production
    needs: publish
    # runs when asked to, after a publish that succeeded or was skipped for a rollback tag
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (inputs.deploy || inputs.tag != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      WEBSITE_TAG: ${{ inputs.tag || needs.publish.outputs.tag }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/id-indetails' }}
    steps:
      - name: Check the target is configured
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          missing=""
          for v in DEPLOY_HOST DEPLOY_USER SSH_KEY KNOWN_HOSTS WEBSITE_TAG; do [ -n "${!v}" ] || missing="$missing $v"; done
          if [ -n "$missing" ]; then
            echo "::error::Not configured:$missing. Set the production environment's secrets (README, Deploying)."
            exit 1
          fi
          # the tag goes into a command on the server: image-tag characters only
          [[ "$WEBSITE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]] || { echo "::error::Not an image tag: $WEBSITE_TAG"; exit 1; }

      # The server's host key is pinned (DEPLOY_KNOWN_HOSTS): an unknown or changed key stops the deployment.
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
          printf 'Host target\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy_key\n  StrictHostKeyChecking yes\n' \
            "$DEPLOY_HOST" "$DEPLOY_USER" > ~/.ssh/config

      # Pulls the image and restarts only the website; the server's compose file reads WEBSITE_TAG.
      - name: Deploy
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # the registry token lives only as long as this job; it is passed on stdin and removed afterwards
          ssh target "docker login ghcr.io -u '${{ github.actor }}' --password-stdin" <<< "$REGISTRY_TOKEN"
          status=0
          # .env may not end with a newline: add one first, or the new tag would join its last line
          ssh target "cd '$DEPLOY_PATH' && sed -i '/^WEBSITE_TAG=/d' .env \
            && { [ -z \"\$(tail -c1 .env)\" ] || echo >> .env; } \
            && echo 'WEBSITE_TAG=$WEBSITE_TAG' >> .env \
            && docker compose -f docker-compose.prod.yml pull website \
            && docker compose -f docker-compose.prod.yml up -d --no-deps website" || status=$?
          ssh target "docker logout ghcr.io" || true
          exit $status

      - name: Summary
        if: always()
        run: |
          {
            echo "### Website deploy: ${{ job.status }}"
            echo "Image: \`$REGISTRY/$IMAGE:$WEBSITE_TAG\`"
            echo ""
            echo "To roll back, run Publish again with an earlier tag."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the SSH key
        if: always()
        run: rm -rf ~/.ssh
